name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'build action') || contains(github.event.head_commit.message, 'build release')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x86_64
          - os: windows-latest
            platform: windows
            arch: aarch64
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
          - os: ubuntu-22.04
            platform: linux
            arch: aarch64
          - os: macos-latest
            platform: macos
            arch: x86_64
          - os: macos-14
            platform: macos
            arch: aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from Cargo.toml
        id: version
        shell: bash
        run: |
          VERSION=$(grep -E '^version\s*=\s*"' src-tauri/Cargo.toml | sed -E 's/.*version\s*=\s*"([^"]+)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install webkit2png

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Install 7z (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install 7zip

      - name: Install 7z (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Create zip package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $APP_NAME = "tauri-demo"
          $VERSION = "${{ steps.version.outputs.VERSION }}"
          $ARCH = "${{ matrix.arch }}"
          
          New-Item -ItemType Directory -Force -Path release | Out-Null
          
          $BINARY = "./src-tauri/target/release/${APP_NAME}.exe"
          $ZIP_NAME = "${APP_NAME}-v${VERSION}-win-${ARCH}.zip"
          
          Compress-Archive -Path "$BINARY", "config.json" -DestinationPath "release/$ZIP_NAME"
          
          Get-ChildItem release/

      - name: Create zip package (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          APP_NAME="tauri-demo"
          VERSION="${{ steps.version.outputs.VERSION }}"
          ARCH="${{ matrix.arch }}"
          
          mkdir -p release
          
          if [ "${{ matrix.platform }}" = "macos" ]; then
            BINARY="./src-tauri/target/release/bundle/macos/${APP_NAME}.app"
            ZIP_NAME="${APP_NAME}-v${VERSION}-macos-${ARCH}.zip"
          else
            BINARY="./src-tauri/target/release/${APP_NAME}"
            ZIP_NAME="${APP_NAME}-v${VERSION}-linux-${ARCH}.zip"
          fi
          
          7z a -tzip "release/$ZIP_NAME" "$BINARY" "config.json"
          
          ls -la release/

      - name: Upload Release Asset
        if: matrix.os == 'windows-latest' && matrix.arch == 'x86_64'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: 'Tauri Demo v${{ steps.version.outputs.VERSION }}'
          body: |
            Platform: ${{ matrix.platform }} ${{ matrix.arch }}
            Version: ${{ steps.version.outputs.VERSION }}
            Built from commit: ${{ github.sha }}
            Trigger: ${{ github.event.head_commit.message }}
          files: release/*.zip
          draft: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        if: matrix.os != 'windows-latest' || matrix.arch != 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*.zip